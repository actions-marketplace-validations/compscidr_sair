name: Release

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          LDFLAGS="-s -w -X github.com/compscidr/sair/internal/version.Version=${VERSION}"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -o dist/sair-device-source ./cmd/sair-device-source
          go build -ldflags="${LDFLAGS}" -o dist/sair-proxy ./cmd/sair-proxy
          go build -ldflags="${LDFLAGS}" -o dist/sair-mcp ./cmd/sair-mcp
          cp tools/sair-acquire dist/
          cp tools/sair-release dist/
          cp tools/sair-wifi dist/
          cp tools/sair-locks dist/
          # --version on the tools reports the release they came from
          sed -i "s/^TOOLS_VERSION=\"dev\"/TOOLS_VERSION=\"${VERSION}\"/" dist/sair-acquire dist/sair-release dist/sair-wifi dist/sair-locks
          [ "$(grep -l "^TOOLS_VERSION=\"${VERSION}\"" dist/sair-* | wc -l)" = 4 ]
          cp -r systemd dist/

      - name: Archive
        run: |
          cd dist
          tar czf ../sair-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz *

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sair-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  # The MCP server as an MCP Bundle (all platforms in one file), listed in the
  # official MCP registry as io.github.compscidr/sair. The bundle runs natively,
  # so the server can read the APKs an agent built on its own machine.
  mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # mcp-publisher login github-oidc proves the io.github.compscidr namespace
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build the bundle
        run: |
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p bundle/bin
          cp -r mcpb/. bundle/
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            GOOS="${t%-*}" GOARCH="${t#*-}" CGO_ENABLED=0 go build \
              -ldflags="-s -w -X github.com/compscidr/sair/internal/version.Version=${TAG}" \
              -o "bundle/bin/sair-mcp-${t}" ./cmd/sair-mcp
          done
          jq --arg v "${TAG#v}" '.version = $v' mcpb/manifest.json > bundle/manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack bundle sair-mcp.mcpb

      - name: Upload the bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sair-mcp.mcpb

      # A version can be published only once; every release gets its own.
      - name: Publish to the MCP registry
        run: |
          mcpb/release-server-json "${{ github.event.release.tag_name }}" sair-mcp.mcpb
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Pull base images as a logged-in user: anonymous pulls share the
      # runner IP's rate limit and fail with 429.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: compscidr
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push device-source
        uses: docker/build-push-action@v7
        with:
          context: .
          target: device-source
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ghcr.io/compscidr/sair-device-source:${{ steps.version.outputs.tag }}
            ghcr.io/compscidr/sair-device-source:${{ steps.version.outputs.version }}
            ghcr.io/compscidr/sair-device-source:latest

      - name: Build and push proxy
        uses: docker/build-push-action@v7
        with:
          context: .
          target: proxy
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ghcr.io/compscidr/sair-proxy:${{ steps.version.outputs.tag }}
            ghcr.io/compscidr/sair-proxy:${{ steps.version.outputs.version }}
            ghcr.io/compscidr/sair-proxy:latest
