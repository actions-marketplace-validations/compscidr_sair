name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      # Stubs are committed so go mod tidy (and Renovate's) can resolve them;
      # fail if they're stale. -I ignores the generator-version header lines.
      - name: Check protobuf stubs are up to date
        run: |
          make proto
          git diff --exit-code -I '^//.*protoc' proto/

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

      - name: Validate the MCP bundle manifest
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json

      # Check server.json as a release would publish it (filled by the same script) against the live registry.
      - name: Validate server.json against the MCP registry
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz -C /tmp mcp-publisher
          echo bundle > /tmp/sair-mcp.mcpb
          mcpb/release-server-json v0.0.1-ci /tmp/sair-mcp.mcpb
          jq -e '.version == "0.0.1-ci" and (.packages[0].identifier | endswith("/v0.0.1-ci/sair-mcp.mcpb")) and (.packages[0].fileSha256 | length == 64)' server.json
          /tmp/mcp-publisher validate
          git checkout server.json

  docker-build:
    runs-on: ubuntu-latest
    env:
      DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
    steps:
      - uses: actions/checkout@v7

      # Pull base images as a logged-in user: anonymous pulls share the
      # runner IP's rate limit and fail with 429. Skipped where the secret is
      # unavailable (fork PRs), which falls back to anonymous pulls.
      - name: Log in to Docker Hub
        if: env.DOCKER_PAT != ''
        uses: docker/login-action@v4
        with:
          username: compscidr
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build Docker images
        run: |
          docker build --target device-source -t sair-device-source:test .
          docker build --target proxy -t sair-proxy:test .

  # The root action.yml is what users pin with `uses: compscidr/sair@vX.Y.Z`.
  setup-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./

      - name: Tools are on PATH
        run: |
          command -v sair-acquire
          command -v sair-release
          command -v sair-wifi
          command -v sair-locks
          command -v sair-label

      # Only checks the proxy comes up: the fake key never gets a lock.
      - uses: ./
        with:
          proxy: true
        env:
          SAIR_API_KEY: ci-fake-key

      - name: Proxy answers
        run: curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8550/status
