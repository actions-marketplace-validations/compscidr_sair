name: Setup SAIR tools
description: >-
  Share physical Android devices across CI jobs with sair-acquire/sair-release.
  Needs an API key from https://sair.run.
branding:
  icon: smartphone
  color: green
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # What the tools' --version reports: the ref this action is used at.
        ACTION_REF: ${{ github.action_ref }}
      run: |
        echo "${GITHUB_ACTION_PATH}/tools" >> "$GITHUB_PATH"
        echo "SAIR_TOOLS_VERSION=${ACTION_REF}" >> "$GITHUB_ENV"
