name: Setup SAIR tools
description: >-
  Put sair-acquire, sair-release and sair-wifi on PATH, pinned to the release tag this
  action is used at (uses: compscidr/sair@vX.Y.Z).
branding:
  icon: smartphone
  color: green
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # What the tools' --version reports: the ref this action is used at.
        ACTION_REF: ${{ github.action_ref }}
      run: |
        echo "${GITHUB_ACTION_PATH}/tools" >> "$GITHUB_PATH"
        echo "SAIR_TOOLS_VERSION=${ACTION_REF}" >> "$GITHUB_ENV"
